[workspace]
resolver = "3"
members = ["crates/*", "app", "xtask"]

[workspace.package]
version = "0.24.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
async-channel = "2.5.0"
base64 = "0.22"
cssparser = "0.38"
encoding_rs = "0.8.35"
form_urlencoded = "1.2.3"
gpui-kit = "=0.11.0"
hex = "0.4"
html5ever = "0.40.1"
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
mail-parser = "0.11"
rand = "0.8"
regex = "1.13.2"
rusqlite = "0.37"
security-framework = { version = "3", features = ["OSX_10_15"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "2.11", default-features = false, features = ["rustls-tls", "zip"] }
resvg = { version = "0.46", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "cookies"] }
reqwest_cookie_store = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "tracing-log"] }
zeroize = { version = "1.8", features = ["derive"] }
