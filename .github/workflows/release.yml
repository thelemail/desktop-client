name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release tag before anything is published
        env:
          TAG: ${{ github.ref_name }}
          FINGERPRINT: ${{ vars.RELEASE_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Not a tag build; nothing will be promotable from this run."
            exit 0
          fi
          if [ -z "$FINGERPRINT" ]; then
            echo "RELEASE_SIGNING_FINGERPRINT is not set." >&2
            exit 1
          fi
          test "$(git cat-file -t "refs/tags/${TAG}")" = tag
          gpg --import .github/release-signing-key.asc
          git verify-tag --raw "refs/tags/${TAG}" 2>&1 | grep -q "VALIDSIG ${FINGERPRINT}"

      - name: Confirm the bundle version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          configured="$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          test "v${configured}" = "$TAG"

  verify:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  macos:
    needs: [preflight, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Fetch the pinned web client tags
        run: git -C web-client fetch --tags --force origin

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web-client/.nvmrc

      - run: corepack enable

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: src-tauri -> target

      - name: Load the signing identity into a throwaway keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -P "$certificate"

      - name: Build, sign, notarize and staple
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$APPLE_API_KEY_PATH"
          ./scripts/release-macos.sh
          rm -P "$APPLE_API_KEY_PATH"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            target/release/Thelemail_*_aarch64.dmg
            target/release/Thelemail_*_aarch64.app.tar.gz
            target/release/Thelemail_*_aarch64.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: [preflight, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Fetch the pinned web client tags
        run: git -C web-client fetch --tags --force origin

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web-client/.nvmrc

      - run: corepack enable

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: src-tauri -> target

      - name: Build OpenSSL with Strawberry Perl
        run: |
          set -euo pipefail
          test -f /c/Strawberry/perl/bin/perl.exe
          printf '%s\n' 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"

      - name: Build and sign the update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/release-windows.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            target/release/bundle/nsis/Thelemail_*_x64-setup.exe
            target/release/bundle/nsis/Thelemail_*_x64-setup.exe.sig
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: built
          merge-multiple: true

      - name: Assemble the release artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p dist
          updater="Thelemail_${version}_aarch64.app.tar.gz"
          installer="Thelemail_${version}_x64-setup.exe"
          download="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cp "built/Thelemail_${version}_aarch64.dmg" dist/
          cp "built/${updater}" "built/${updater}.sig" dist/
          cp "built/${installer}" "built/${installer}.sig" dist/
          jq -n --arg version "$version" \
                --arg notes "Thelemail ${version}" \
                --arg pubDate "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg macUrl "${download}/${updater}" \
                --rawfile macSignature "dist/${updater}.sig" \
                --arg windowsUrl "${download}/${installer}" \
                --rawfile windowsSignature "dist/${installer}.sig" \
                '{version: $version, notes: $notes, pub_date: $pubDate, platforms: {
                    "darwin-aarch64": {signature: ($macSignature | rtrimstr("\n")), url: $macUrl},
                    "windows-x86_64": {signature: ($windowsSignature | rtrimstr("\n")), url: $windowsUrl}
                  }}' \
            > dist/latest.json
          jq -n --arg tag "$TAG" --arg commit "$GITHUB_SHA" \
                --arg webClient "$(cat web-client.version)" \
                --arg webClientCommit "$(git -C web-client rev-parse HEAD)" \
                '{tag: $tag, commit: $commit, webClient: $webClient, webClientCommit: $webClientCommit, arch: "aarch64", targets: ["darwin-aarch64", "windows-x86_64"]}' \
            > dist/release-metadata.json
          cd dist
          shasum -a 256 ./*.dmg ./*.app.tar.gz ./*.app.tar.gz.sig ./*-setup.exe ./*-setup.exe.sig latest.json release-metadata.json > SHA256SUMS
          sort -k2 -o SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Source bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.source.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.app.tar.gz
            dist/*-setup.exe
            dist/latest.json
            dist/release-metadata.json
            dist/SHA256SUMS

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/SHA256SUMS
          sbom-path: dist/sbom.source.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'UI from web-client `%s`.\n\n' "$(cat web-client.version)"
            printf 'macOS: Apple Silicon build, signed with Developer ID and notarized by Apple.\n'
            printf 'Windows: x64 installer. It is not Authenticode-signed yet, so SmartScreen asks before the first run.\n\n'
            printf 'Verify before installing:\n\n'
            printf '    shasum -a 256 -c SHA256SUMS\n'
            printf '    spctl --assess --type open --context context:primary-signature -v Thelemail_*.dmg\n'
            printf '    Get-FileHash -Algorithm SHA256 Thelemail_*_x64-setup.exe\n'
          } > dist/notes.md
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file dist/notes.md \
            dist/*.dmg \
            dist/*.app.tar.gz \
            dist/*.app.tar.gz.sig \
            dist/*-setup.exe \
            dist/*-setup.exe.sig \
            dist/latest.json \
            dist/release-metadata.json \
            dist/sbom.source.spdx.json \
            dist/SHA256SUMS \
            dist/SHA256SUMS.sigstore.json
