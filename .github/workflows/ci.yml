name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      TRUST_READ_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Fetch the pinned web client tags
        run: git -C web-client fetch --tags --force origin

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web-client/.nvmrc

      - run: corepack enable

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: trust/go.mod
          cache-dependency-path: |
            trust/go.sum
            xtask/go/go.sum

      - uses: ./.github/actions/private-modules
        with:
          token: ${{ secrets.TRUST_READ_TOKEN }}

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: . -> target

      - run: cargo fmt --all --check

      - run: cargo xtask tokens --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace


  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Fetch the pinned web client tags
        run: git -C web-client fetch --tags --force origin

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web-client/.nvmrc

      - run: corepack enable

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: trust/go.mod
          cache-dependency-path: |
            trust/go.sum
            xtask/go/go.sum

      - uses: ./.github/actions/private-modules
        with:
          token: ${{ secrets.TRUST_READ_TOKEN }}

      - name: Put MinGW in front for the trust library
        run: |
          set -euo pipefail
          echo "/c/mingw64/bin" >> "$GITHUB_PATH"
          echo "TRUST_MINGW_CC=gcc" >> "$GITHUB_ENV"

      - name: Check the MinGW toolchain
        run: |
          set -euo pipefail
          gcc --version
          objdump --version

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: . -> target

      - name: Build OpenSSL with Strawberry Perl
        run: |
          set -euo pipefail
          test -f /c/Strawberry/perl/bin/perl.exe
          printf '%s\n' 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace
