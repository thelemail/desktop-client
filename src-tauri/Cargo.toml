[package]
name = "thelemail-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "thelemail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64.workspace = true
rand.workspace = true
futures-util = "0.3"
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }
hex.workspace = true
semver = "1"
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-updater.workspace = true
thelemail-api = { path = "../crates/thelemail-api" }
thelemail-crypto = { path = "../crates/thelemail-crypto" }
thelemail-keystore = { path = "../crates/thelemail-keystore" }
thelemail-mime = { path = "../crates/thelemail-mime" }
thelemail-store = { path = "../crates/thelemail-store" }
tokio.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
zeroize.workspace = true
sys-locale = "0.3.2"

[target."cfg(target_os = \"macos\")".dependencies]
block2 = "0.6.2"
flate2 = "1.1"
libc = "0.2"
plist = "1.10"
tar = "0.4.46"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSDictionary", "NSError", "NSArray", "NSDate", "NSObject", "NSEnumerator"] }
objc2-user-notifications = { version = "0.3.2", features = [
    "UNUserNotificationCenter",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotification",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNError",
    "block2",
] }
security-framework.workspace = true

[target."cfg(windows)".dependencies]
dataview = "1.1"
pelite = "0.10.0"
tauri-plugin-single-instance = "2.5"
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_UI_Shell",
] }

[dev-dependencies]
dataview = "1.1"
pelite = "0.10.0"
reqwest = { workspace = true, features = ["blocking", "json"] }
tempfile = "3"
thelemail-store = { path = "../crates/thelemail-store" }

[features]
devtools = ["tauri/devtools"]
