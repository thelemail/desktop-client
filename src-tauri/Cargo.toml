[package]
name = "thelemail-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "thelemail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64.workspace = true
rand.workspace = true
futures-util = "0.3"
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }
hex.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-opener.workspace = true
thelemail-api = { path = "../crates/thelemail-api" }
thelemail-crypto = { path = "../crates/thelemail-crypto" }
thelemail-keystore = { path = "../crates/thelemail-keystore" }
thelemail-mime = { path = "../crates/thelemail-mime" }
thelemail-store = { path = "../crates/thelemail-store" }
tokio.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
zeroize.workspace = true

[target."cfg(target_os = \"macos\")".dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSDictionary", "NSError", "NSArray", "NSDate", "NSObject", "NSEnumerator"] }
objc2-user-notifications = { version = "0.3.2", features = [
    "UNUserNotificationCenter",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotification",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNError",
    "block2",
] }
security-framework.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["blocking", "json"] }
tempfile = "3"
thelemail-store = { path = "../crates/thelemail-store" }

[features]
devtools = ["tauri/devtools"]
